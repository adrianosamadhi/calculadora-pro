<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precificação Pro - Adriano Santos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icone-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background-color: #0B1120; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configurações extraídas do seu histórico de sucesso
        const supabaseUrl = 'https://pttckajgbilxtlvhrdsm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0dGNrYWpnYmlseHRsdmhyZHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMzkyMDYsImV4cCI6MjA4Nzc0NTIwNn0.8buGbTrL0_nsFW9B0JPf_PyFeYbvAbe2UjMISpdQ6Os';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('Calculadora@123');
            const [showPassword, setShowPassword] = useState(false);
            const [authError, setAuthError] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setAuthError('');
                
                // Limpeza de dados para garantir o "aperto de mão" com o banco
                const cleanEmail = email.trim().toLowerCase(); 

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: cleanEmail,
                    password: password,
                });

                if (error) {
                    setAuthError('E-mail ou senha incorretos. Verifique os dados da compra.');
                } else {
                    setIsLoggedIn(true);
                }
                setIsLoading(false);
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                        <div className="w-full max-w-[440px] bg-[#111827] border border-slate-800 rounded-3xl p-10 shadow-2xl relative z-10 animate-fade-in">
                            <div className="text-center mb-8">
                                <img src="logo.png" className="mx-auto h-20 mb-4 object-contain rounded-xl drop-shadow-[0_0_15px_rgba(249,115,22,0.3)]" onError={(e) => e.target.src='https://placehold.co/80x80/111827/orange?text=AS'} />
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-400">Acesso Exclusivo</h1>
                                <p className="text-slate-400 text-sm mt-2">Faça login para usar a Calculadora Pro.</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div className="space-y-2">
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400">E-mail</label>
                                    <div className="relative">
                                        <i className="ph ph-envelope-simple absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seu@email.com" className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-4 focus:ring-2 focus:ring-orange-500 outline-none transition-all" />
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Senha</label>
                                    <div className="relative">
                                        <i className="ph ph-key absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                                        <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-12 focus:ring-2 focus:ring-orange-500 outline-none transition-all" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500 hover:text-white transition-colors">
                                            <i className={showPassword ? "ph ph-eye-closed text-xl" : "ph ph-eye text-xl"}></i>
                                        </button>
                                    </div>
                                    <p className="text-[12px] text-slate-400 mt-2 flex items-start gap-1.5 leading-snug">
                                        <i className="ph-fill ph-info text-orange-500 mt-0.5 shrink-0"></i> 
                                        <span>Aviso: Use o e-mail da compra. Senha: <strong className="text-orange-400">Calculadora@123</strong></span>
                                    </p>
                                </div>
                                {authError && <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm flex items-center gap-2"><i className="ph ph-warning-circle"></i>{authError}</div>}
                                <button type="submit" disabled={isLoading} className="w-full py-4 bg-gradient-to-r from-orange-500 to-rose-500 text-white rounded-xl font-bold shadow-lg disabled:opacity-50 transition-all active:scale-95">
                                    {isLoading ? "Autenticando..." : "Entrar"}
                                </button>
                            </form>
                            <p className="text-center mt-6 text-xs text-slate-500">
                                Ainda não tem acesso? <a href="https://pay.kiwify.com.br/mK7V6Yd" target="_blank" className="text-orange-400 hover:text-orange-300 font-bold underline transition-colors">Adquira sua licença aqui</a>.
                            </p>
                        </div>
                    </div>
                );
            }

            return <div className="p-10 text-white text-center"><h1 className="text-2xl font-bold uppercase tracking-widest">Calculadora Turbo Logada!</h1><button onClick={() => setIsLoggedIn(false)} className="mt-4 text-orange-400 underline">Sair</button></div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
