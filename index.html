<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precificação Marketplaces - Adriano Santos</title>
    <link rel="manifest" href="manifest.json?v=23">
    <link rel="apple-touch-icon" href="icone-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background-color: #0B1120; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const mlRates = [
            { maxWeight: 0.3, label: "Até 0,3 kg", rates: [5.65, 6.55, 7.75, 12.35, 14.35, 16.45, 18.45, 20.95], fastFreeRate: 12.35 },
            { maxWeight: 0.5, label: "De 0,3 a 0,5 kg", rates: [5.95, 6.65, 7.85, 13.25, 15.45, 17.65, 19.85, 22.55], fastFreeRate: 13.25 },
            { maxWeight: 1.0, label: "De 0,5 a 1 kg", rates: [6.05, 6.75, 7.95, 13.85, 16.15, 18.45, 20.75, 23.65], fastFreeRate: 13.85 },
            { maxWeight: 1.5, label: "De 1 a 1,5 kg", rates: [6.15, 6.85, 8.05, 14.15, 16.45, 18.85, 21.15, 24.65], fastFreeRate: 14.15 },
            { maxWeight: 2.0, label: "De 1,5 a 2 kg", rates: [6.25, 6.95, 8.15, 14.45, 16.85, 19.25, 21.65, 24.65], fastFreeRate: 14.45 },
            { maxWeight: 3.0, label: "De 2 a 3 kg", rates: [6.35, 7.95, 8.55, 15.75, 18.35, 21.05, 23.65, 26.25], fastFreeRate: 15.75 },
            { maxWeight: 4.0, label: "De 3 a 4 kg", rates: [6.45, 8.15, 8.95, 17.05, 19.85, 22.65, 25.55, 28.35], fastFreeRate: 17.05 },
            { maxWeight: 5.0, label: "De 4 a 5 kg", rates: [6.55, 8.35, 9.75, 18.45, 21.55, 24.65, 27.75, 30.75], fastFreeRate: 18.45 },
            { maxWeight: 6.0, label: "De 5 a 6 kg", rates: [6.65, 8.55, 9.95, 25.45, 28.55, 32.65, 35.75, 39.75], fastFreeRate: 25.45 },
            { maxWeight: 7.0, label: "De 6 a 7 kg", rates: [6.75, 8.75, 10.15, 27.05, 31.05, 36.05, 40.05, 44.05], fastFreeRate: 27.05 },
            { maxWeight: 8.0, label: "De 7 a 8 kg", rates: [6.85, 8.95, 10.35, 28.85, 33.65, 38.45, 43.25, 48.05], fastFreeRate: 28.85 },
            { maxWeight: 9.0, label: "De 8 a 9 kg", rates: [6.95, 9.15, 10.55, 29.65, 34.55, 39.55, 44.45, 49.35], fastFreeRate: 29.65 },
            { maxWeight: 11.0, label: "De 9 a 11 kg", rates: [7.05, 9.55, 10.95, 41.25, 48.05, 54.95, 61.75, 68.65], fastFreeRate: 41.25 },
            { maxWeight: 13.0, label: "De 11 a 13 kg", rates: [7.15, 9.95, 11.35, 42.15, 49.25, 56.25, 63.25, 70.25], fastFreeRate: 42.15 },
            { maxWeight: 15.0, label: "De 13 a 15 kg", rates: [7.25, 10.15, 11.55, 45.05, 52.45, 59.95, 67.45, 74.95], fastFreeRate: 45.05 },
            { maxWeight: 17.0, label: "De 15 a 17 kg", rates: [7.35, 10.35, 11.75, 48.55, 56.05, 63.55, 70.75, 78.65], fastFreeRate: 48.55 },
            { maxWeight: 20.0, label: "De 17 a 20 kg", rates: [7.45, 10.55, 11.95, 54.75, 63.85, 72.95, 82.05, 91.15], fastFreeRate: 54.75 },
            { maxWeight: 25.0, label: "De 20 a 25 kg", rates: [7.65, 10.95, 12.15, 64.05, 75.05, 84.75, 95.35, 105.95], fastFreeRate: 64.05 },
            { maxWeight: 30.0, label: "De 25 a 30 kg", rates: [7.75, 11.15, 12.35, 65.95, 75.45, 85.55, 96.25, 106.95], fastFreeRate: 65.95 },
            { maxWeight: 40.0, label: "De 30 a 40 kg", rates: [7.85, 11.35, 12.55, 67.75, 78.95, 88.95, 99.15, 107.05], fastFreeRate: 67.75 },
            { maxWeight: 50.0, label: "De 40 a 50 kg", rates: [7.95, 11.55, 12.75, 70.25, 81.05, 92.05, 102.55, 110.75], fastFreeRate: 70.25 },
            { maxWeight: 60.0, label: "De 50 a 60 kg", rates: [8.05, 11.75, 12.95, 74.95, 86.45, 98.15, 109.35, 118.15], fastFreeRate: 74.95 },
            { maxWeight: 70.0, label: "De 60 a 70 kg", rates: [8.15, 11.95, 13.15, 80.25, 92.95, 105.05, 117.15, 126.55], fastFreeRate: 80.25 },
            { maxWeight: 80.0, label: "De 70 a 80 kg", rates: [8.25, 12.15, 13.35, 83.95, 97.05, 109.85, 122.45, 132.25], fastFreeRate: 83.95 },
            { maxWeight: 90.0, label: "De 80 a 90 kg", rates: [8.35, 12.35, 13.55, 93.25, 107.45, 122.05, 136.05, 146.95], fastFreeRate: 93.25 },
            { maxWeight: 100.0, label: "De 90 a 100 kg", rates: [8.45, 12.55, 13.75, 106.55, 123.95, 139.55, 155.55, 167.95], fastFreeRate: 106.55 },
            { maxWeight: 125.0, label: "De 100 a 125 kg", rates: [8.55, 12.75, 13.95, 119.25, 138.05, 156.05, 173.95, 187.95], fastFreeRate: 119.25 },
            { maxWeight: 150.0, label: "De 125 a 150 kg", rates: [8.65, 12.75, 14.15, 126.55, 146.15, 165.65, 184.65, 199.45], fastFreeRate: 126.55 },
            { maxWeight: Infinity, label: "Mais de 150 kg", rates: [8.75, 12.95, 14.35, 166.15, 192.45, 217.55, 242.55, 261.95], fastFreeRate: 166.15 }
        ];

        const mlPriceTiers = [18.99, 48.99, 78.99, 99.99, 119.99, 149.99, 199.99, Infinity];
        const mlTierNames = [
          "Até R$ 18,99", "R$ 19 a R$ 48,99", "R$ 49 a R$ 78,99", "R$ 79 a R$ 99,99", 
          "R$ 100 a R$ 119,99", "R$ 120 a R$ 149,99", "R$ 150 a R$ 199,99", "Acima de R$ 200"
        ];

        const formatCurrency = (value) => {
          if (!value) return "0,00";
          const numericValue = value.replace(/\D/g, "");
          const floatValue = (Number(numericValue) / 100).toFixed(2);
          return floatValue.replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };

        const parseCurrency = (val) => Number(val.replace(/\./g, '').replace(',', '.')) || 0;
        const parsePercent = (val) => Number(val.replace(',', '.')) || 0;
        const parseWeight = (val) => Number(val.replace(',', '.')) || 0;

        function App() {
          const [isLoggedIn, setIsLoggedIn] = useState(() => {
              return localStorage.getItem('calculadoraPro_auth') === 'true';
          });
          
          const [emailLogin, setEmailLogin] = useState('');
          const [password, setPassword] = useState('Calculadora@123');
          const [showPassword, setShowPassword] = useState(false);
          const [authError, setAuthError] = useState('');

          const [isDarkMode, setIsDarkMode] = useState(true);
          const [platform, setPlatform] = useState('ML'); 
          
          const [custoProduto, setCustoProduto] = useState('');
          const [embalagem, setEmbalagem] = useState('');
          const [imposto, setImposto] = useState('');
          const [lucroDesejado, setLucroDesejado] = useState('20');
          
          const [taxaMarketplace, setTaxaMarketplace] = useState('14'); 
          const [pesoInput, setPesoInput] = useState(''); 
          const [isPremium, setIsPremium] = useState(false);
          const [ofereceFreteGratis, setOfereceFreteGratis] = useState(false);

          // Estados do Ajudante de Cubagem
          const [showCubagem, setShowCubagem] = useState(false);
          const [dimComprimento, setDimComprimento] = useState('');
          const [dimLargura, setDimLargura] = useState('');
          const [dimAltura, setDimAltura] = useState('');
          const [pesoFisico, setPesoFisico] = useState('');

          const [resultado, setResultado] = useState(null);
          const [erro, setErro] = useState(null);

          const handleLogin = (e) => {
              e.preventDefault();
              setAuthError('');
              if (password === 'Calculadora@123' || password === '735589') {
                  setIsLoggedIn(true);
                  localStorage.setItem('calculadoraPro_auth', 'true'); 
              } else {
                  setAuthError('E-mail ou senha incorretos. Verifique os dados.');
              }
          };

          const handleLogout = () => {
              setIsLoggedIn(false);
              localStorage.removeItem('calculadoraPro_auth'); 
          };

          const handleCurrencyChange = (setter) => (e) => {
            setter(formatCurrency(e.target.value));
          };

          const handlePercentChange = (setter) => (e) => {
            let val = e.target.value.replace(/[^0-9,]/g, '');
            setter(val);
          };

          const aplicarCubagem = () => {
              const c = Number(dimComprimento.replace(',', '.')) || 0;
              const l = Number(dimLargura.replace(',', '.')) || 0;
              const a = Number(dimAltura.replace(',', '.')) || 0;
              const pFisico = Number(pesoFisico.replace(',', '.')) || 0;
              
              const pCubico = (c * l * a) / 6000;
              const pesoFinal = Math.max(pFisico, pCubico);
              
              setPesoInput(pesoFinal.toFixed(2).replace('.', ','));
              setShowCubagem(false);
          };

          const calcular = () => {
            setErro(null);
            setResultado(null);

            const custo = parseCurrency(custoProduto);
            const emb = parseCurrency(embalagem);
            const impostoPct = parsePercent(imposto) / 100;
            const lucroPct = parsePercent(lucroDesejado) / 100;
            const taxaMLPct = parsePercent(taxaMarketplace) / 100;
            const peso = parseWeight(pesoInput);

            const basePct = platform === 'ML' ? (impostoPct + lucroPct + taxaMLPct + (isPremium ? 0.05 : 0)) : (impostoPct + lucroPct + 0.20); 
            if (basePct >= 1) {
              setErro("Soma das margens $\ge$ 100%.");
              return;
            }

            if (custo === 0) {
              setErro("Insira o Custo.");
              return;
            }

            if (platform === 'ML' && peso <= 0) {
              setErro("Insira um peso.");
              return;
            }

            let melhorPreco = null;
            let detalhesCalculo = null;

            for (let p = custo + emb; p <= 15000; p += 0.01) {
              let comissaoVenda = 0;
              let custoOperacionalPlataforma = 0;
              let freteVendedor = 0;
              let comissaoPctReal = 0;
              let nomeFaixaPreco = "";
              let nomeFaixaPeso = "";

              if (platform === 'SHOPEE') {
                if (p <= 79.99) {
                  comissaoPctReal = 0.20;
                  custoOperacionalPlataforma = 4;
                } else if (p <= 99.99) {
                  comissaoPctReal = 0.14;
                  custoOperacionalPlataforma = 16;
                } else if (p <= 199.99) {
                  comissaoPctReal = 0.14;
                  custoOperacionalPlataforma = 20;
                } else {
                  comissaoPctReal = 0.14;
                  custoOperacionalPlataforma = 26;
                }
                comissaoVenda = p * comissaoPctReal;
              } 
              else if (platform === 'ML') {
                comissaoPctReal = taxaMLPct + (isPremium ? 0.05 : 0);
                comissaoVenda = p * comissaoPctReal;
                
                let tierIdx = mlPriceTiers.findIndex(t => p <= t);
                if (tierIdx === -1) tierIdx = mlPriceTiers.length - 1;
                nomeFaixaPreco = mlTierNames[tierIdx];

                let pesoObj = mlRates.find(item => peso <= item.maxWeight);
                if (!pesoObj) pesoObj = mlRates[mlRates.length - 1]; 
                nomeFaixaPeso = pesoObj.label;
                
                let valorTarifaAtual = pesoObj.rates[tierIdx];

                if (p < 79) {
                    if (ofereceFreteGratis) {
                        freteVendedor = pesoObj.fastFreeRate; 
                        custoOperacionalPlataforma = 0; 
                    } else {
                        custoOperacionalPlataforma = valorTarifaAtual; 
                        freteVendedor = 0; 
                    }
                } else {
                    custoOperacionalPlataforma = 0; 
                    freteVendedor = valorTarifaAtual; 
                }
              }

              const valorImposto = p * impostoPct;
              const custosTotais = custo + emb + custoOperacionalPlataforma + freteVendedor + comissaoVenda + valorImposto;
              const lucroAtual = p - custosTotais;
              const lucroAtualPct = lucroAtual / p;

              if (lucroAtualPct >= lucroPct) {
                melhorPreco = p;
                detalhesCalculo = {
                  custoBase: custo + emb,
                  freteTaxa: freteVendedor,
                  taxaFixa: custoOperacionalPlataforma,
                  comissaoVenda,
                  valorImposto,
                  lucroLiq: lucroAtual,
                  lucroLiqPct: lucroAtualPct * 100,
                  margemUsada: comissaoPctReal * 100,
                  faixaAplicada: `${nomeFaixaPeso} | ${nomeFaixaPreco}`
                };
                break;
              }
            }

            if (melhorPreco) {
              setResultado({ precoSugerido: melhorPreco, ...detalhesCalculo });
            } else {
              setErro("Não foi possível encontrar um preço viável.");
            }
          };

          useEffect(() => {
            setResultado(null);
            setErro(null);
          }, [platform, custoProduto, embalagem, imposto, lucroDesejado, taxaMarketplace, pesoInput, isPremium, ofereceFreteGratis]);

          const theme = {
            label: `text-[9px] md:text-[10px] font-bold uppercase tracking-wide ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`,
            icon: isDarkMode ? "text-slate-500" : "text-slate-400",
            input: `w-full py-1 md:py-1.5 border rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all font-semibold text-xs md:text-sm ${isDarkMode ? 'bg-slate-950 border-slate-700 text-white placeholder-slate-600' : 'bg-slate-50 border-slate-200 text-slate-800 placeholder-slate-400'}`,
            lucroLabel: "text-[9px] md:text-[10px] font-bold uppercase tracking-wide text-orange-500",
            lucroInput: `w-full pl-2 pr-7 py-1 md:py-1.5 border rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all font-bold text-xs md:text-sm ${isDarkMode ? 'bg-orange-500/10 border-orange-500/30 text-orange-400 placeholder-orange-700/50' : 'bg-orange-50 border-orange-200 text-orange-700 placeholder-orange-300'}`,
            error: `mt-2 p-1.5 rounded-lg flex items-center gap-1.5 font-medium border text-[10px] md:text-xs ${isDarkMode ? 'bg-red-500/10 border-red-500/20 text-red-400' : 'bg-red-50 border-red-200 text-red-600'}`,
            resultCard: `rounded-xl p-3 md:p-4 text-white shadow-inner relative overflow-hidden border ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-gradient-to-br from-slate-800 to-slate-900 border-slate-700'}`,
            resultItemBorder: isDarkMode ? 'border-slate-800' : 'border-slate-700',
            composicaoBg: `mt-2 p-2 rounded-lg border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-800/50 border-slate-700'}`,
          };

          if (!isLoggedIn) {
              return (
                  <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                      <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                      <div className="w-full max-w-[440px] bg-[#111827] border border-slate-800 rounded-3xl p-8 md:p-10 shadow-2xl relative z-10 animate-fade-in">
                          <div className="text-center mb-8">
                              <img src="logo.png" className="mx-auto h-20 md:h-24 mb-4 object-contain rounded-xl drop-shadow-[0_0_15px_rgba(249,115,22,0.3)]" onError={(e) => e.target.style.display='none'} />
                              <h1 className="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-400">Acesso Exclusivo</h1>
                              <p className="text-slate-400 text-sm mt-2">Faça login para usar a Calculadora.</p>
                          </div>
                          <form onSubmit={handleLogin} className="space-y-5">
                              <div className="space-y-2">
                                  <label className="text-xs font-bold uppercase tracking-wider text-slate-400">E-mail</label>
                                  <div className="relative">
                                      <i className="ph ph-envelope-simple absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                                      <input type="email" required value={emailLogin} onChange={(e) => setEmailLogin(e.target.value)} placeholder="Seu e-mail da Kiwify" className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-4 focus:ring-2 focus:ring-orange-500 outline-none transition-all text-sm" />
                                  </div>
                              </div>
                              
                              <div className="space-y-2">
                                  <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Senha</label>
                                  <div className="relative">
                                      <i className="ph ph-key absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                                      <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-12 focus:ring-2 focus:ring-orange-500 outline-none transition-all text-sm" />
                                      <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500 hover:text-white transition-colors">
                                          <i className={showPassword ? "ph ph-eye-closed text-xl" : "ph ph-eye text-xl"}></i>
                                      </button>
                                  </div>
                                  <p className="text-xs text-slate-400 mt-2 flex items-start gap-1.5 leading-snug">
                                      <i className="ph-fill ph-info text-orange-500 mt-0.5 shrink-0"></i> 
                                      <span>Aviso: Use o e-mail da compra. Senha: <strong className="text-orange-400">Calculadora@123</strong></span>
                                  </p>
                              </div>

                              {authError && <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm flex items-center gap-2"><i className="ph ph-warning-circle"></i>{authError}</div>}
                              <button type="submit" className="w-full py-3.5 md:py-4 bg-gradient-to-r from-orange-500 to-rose-500 text-white rounded-xl font-bold shadow-lg transition-all active:scale-95 text-sm md:text-base">
                                  Entrar no Sistema
                              </button>
                          </form>
                      </div>
                  </div>
              );
          }

          return (
            <div className={`min-h-screen flex flex-col justify-center py-1 px-3 md:px-4 font-sans transition-colors duration-300 ${isDarkMode ? 'bg-slate-950 text-slate-200' : 'bg-gradient-to-br from-slate-100 to-slate-200 text-slate-800'}`}>
              <div className="max-w-3xl mx-auto w-full relative">
                
                <button
                  onClick={handleLogout}
                  className={`absolute top-0 left-0 p-1.5 md:p-2 z-50 rounded-full transition-all duration-300 flex items-center justify-center ${
                    isDarkMode ? 'text-rose-400 hover:bg-slate-800' : 'text-rose-500 hover:bg-slate-200'
                  }`}
                  title="Sair"
                >
                  <i className="ph-fill ph-lock-key text-base md:text-lg"></i>
                </button>

                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className={`absolute top-0 right-0 p-1.5 md:p-2 z-50 rounded-full transition-all duration-300 flex items-center justify-center ${
                    isDarkMode ? 'text-yellow-400 hover:bg-slate-800' : 'text-slate-500 hover:bg-slate-200'
                  }`}
                  title="Tema"
                >
                  {isDarkMode ? <i className="ph-fill ph-sun text-base md:text-lg"></i> : <i className="ph-fill ph-moon text-base md:text-lg"></i>}
                </button>

                {/* HEADER COMPACTO COM LOGO ABSOLUTA */}
                <div className="relative flex items-center justify-center pt-8 md:pt-4 mb-2 md:mb-2">
                    <div className="absolute left-0 top-1/2 -translate-y-1/2 hidden md:block z-10 pointer-events-none">
                        <img src="logo.png" alt="Logo" className="h-20 object-contain drop-shadow-[0_0_10px_rgba(249,115,22,0.3)]" onError={(e) => e.target.style.display='none'} />
                    </div>
                    <img src="logo.png" alt="Logo" className="h-12 mb-1 block md:hidden object-contain drop-shadow-[0_0_10px_rgba(249,115,22,0.3)]" onError={(e) => e.target.style.display='none'} />
                    <h1 className="text-xl md:text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-rose-400 z-20">
                        Calculadora de Precificação
                    </h1>
                </div>

                <div className={`rounded-2xl shadow-lg overflow-hidden border transition-colors duration-300 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  
                  <div className="flex w-full">
                    <button
                      onClick={() => setPlatform('ML')}
                      className={`flex-1 py-1.5 md:py-2 text-[11px] md:text-sm font-bold transition-all duration-300 flex justify-center items-center gap-1.5 ${
                        platform === 'ML' 
                        ? 'bg-yellow-400 text-yellow-950 border-b-2 border-yellow-600' 
                        : isDarkMode 
                          ? 'bg-slate-950 text-slate-500 hover:bg-slate-800 hover:text-slate-300'
                          : 'bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-700'
                      }`}
                    >
                      <i className="ph-bold ph-shopping-bag text-sm md:text-base"></i> Mercado Livre
                    </button>
                    <button
                      onClick={() => setPlatform('SHOPEE')}
                      className={`flex-1 py-1.5 md:py-2 text-[11px] md:text-sm font-bold transition-all duration-300 flex justify-center items-center gap-1.5 ${
                        platform === 'SHOPEE' 
                        ? 'bg-orange-500 text-white border-b-2 border-orange-700' 
                        : isDarkMode 
                          ? 'bg-slate-950 text-slate-500 hover:bg-slate-800 hover:text-slate-300'
                          : 'bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-700'
                      }`}
                    >
                      <i className="ph-bold ph-shopping-bag text-sm md:text-base"></i> Shopee
                    </button>
                  </div>

                  <div className="p-2.5 md:p-3">
                    
                    <div className={`mb-1.5 p-1.5 rounded-lg flex items-center gap-2 border transition-colors ${
                      platform === 'ML' 
                        ? isDarkMode ? 'bg-yellow-500/10 border-yellow-500/20 text-yellow-300' : 'bg-yellow-50 border-yellow-200 text-yellow-800'
                        : isDarkMode ? 'bg-orange-500/10 border-orange-500/20 text-orange-300' : 'bg-orange-50 border-orange-200 text-orange-800'
                    }`}>
                      <i className="ph-fill ph-info text-xs shrink-0"></i>
                      <p className="text-[9px] md:text-[10px] leading-snug">
                        <strong>Tabela Atualizada:</strong> Digite seus custos abaixo e descubra o preço exato.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                      
                      <div className="space-y-0.5">
                        <label className={theme.label}>Custo Produto (R$)</label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                            <i className={`ph-bold ph-currency-dollar text-xs ${theme.icon}`}></i>
                          </div>
                          <input type="text" value={custoProduto} onChange={handleCurrencyChange(setCustoProduto)} placeholder="0,00" className={`${theme.input} pl-7 pr-2`} />
                        </div>
                      </div>

                      <div className="space-y-0.5">
                        <label className={theme.label}>Embalagem/Outros (R$)</label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                            <i className={`ph-bold ph-package text-xs ${theme.icon}`}></i>
                          </div>
                          <input type="text" value={embalagem} onChange={handleCurrencyChange(setEmbalagem)} placeholder="0,00" className={`${theme.input} pl-7 pr-2`} />
                        </div>
                      </div>

                      <div className="space-y-0.5">
                        <label className={`${theme.label} flex justify-between`}>
                          <span>Imposto Venda</span>
                          <span className={`text-[8px] md:text-[9px] font-normal mt-0.5 ${isDarkMode ? 'text-slate-500' : 'text-slate-400'}`}>(MEI=vazio)</span>
                        </label>
                        <div className="relative">
                          <input type="text" value={imposto} onChange={handlePercentChange(setImposto)} placeholder="0" className={`${theme.input} pl-2 pr-6`} />
                          <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                            <i className={`ph-bold ph-percent text-xs ${theme.icon}`}></i>
                          </div>
                        </div>
                      </div>

                      <div className="space-y-0.5">
                        <label className={theme.lucroLabel}>Lucro Desejado</label>
                        <div className="relative">
                          <input type="text" value={lucroDesejado} onChange={handlePercentChange(setLucroDesejado)} placeholder="20" className={theme.lucroInput} />
                          <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                            <i className="ph-bold ph-percent text-xs text-orange-500"></i>
                          </div>
                        </div>
                      </div>

                      {platform === 'ML' && (
                        <>
                          <div className={`md:col-span-2 space-y-1.5 p-2 rounded-xl border ${isDarkMode ? 'border-slate-800 bg-[#0f172a]' : 'border-slate-200 bg-slate-50'}`}>
                            
                            <div className="space-y-0.5">
                                <label className={theme.label}>Anúncio</label>
                                <div className={`flex border rounded-lg p-0.5 ${isDarkMode ? 'bg-[#030712] border-slate-800' : 'bg-white border-slate-200'}`}>
                                    <button
                                        type="button"
                                        onClick={() => setIsPremium(false)}
                                        className={`flex-1 py-1 rounded-md text-[9px] md:text-[10px] font-bold transition-all duration-300 flex justify-center items-center gap-1 ${!isPremium ? 'bg-yellow-400 text-yellow-950 shadow' : 'text-slate-500 hover:text-slate-300'}`}
                                    >
                                        <i className={!isPremium ? "ph-fill ph-star" : "ph ph-star"}></i> Clássico
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setIsPremium(true)}
                                        className={`flex-1 py-1 rounded-md text-[9px] md:text-[10px] font-bold transition-all duration-300 flex justify-center items-center gap-1 ${isPremium ? 'bg-orange-500 text-white shadow' : 'text-slate-500 hover:text-slate-300'}`}
                                    >
                                        <i className={isPremium ? "ph-fill ph-crown" : "ph ph-crown"}></i> Premium <span className="text-[7px] bg-white/20 px-1 py-0.5 rounded ml-1">+5%</span>
                                    </button>
                                </div>
                            </div>

                            <div className={`flex items-center justify-between pt-1 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                                <div>
                                    <span className={`text-[9px] md:text-[10px] font-bold transition-colors ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>
                                        Frete Grátis (< R$ 79)
                                    </span>
                                </div>
                                <div
                                    onClick={() => setOfereceFreteGratis(!ofereceFreteGratis)}
                                    className={`w-8 h-4 flex items-center rounded-full p-0.5 cursor-pointer transition-colors duration-300 ${ofereceFreteGratis ? 'bg-orange-500' : (isDarkMode ? 'bg-slate-700' : 'bg-slate-300')}`}
                                >
                                    <div className={`bg-white w-3 h-3 rounded-full shadow-sm transform transition-transform duration-300 ${ofereceFreteGratis ? 'translate-x-4' : 'translate-x-0'}`}></div>
                                </div>
                            </div>

                          </div>

                          <div className="space-y-0.5">
                            <label className={theme.label}>Taxa Clássico</label>
                            <div className="relative">
                              <input type="text" value={taxaMarketplace} onChange={handlePercentChange(setTaxaMarketplace)} placeholder="14" className={`${theme.input} pl-2 pr-6`} />
                              <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                                <i className={`ph-bold ph-percent text-xs ${theme.icon}`}></i>
                              </div>
                            </div>
                          </div>

                          <div className="space-y-0.5 relative">
                            <div className="flex justify-between items-center mb-0.5">
                                <label className={theme.label}>Peso (kg)</label>
                                <button 
                                    onClick={() => setShowCubagem(!showCubagem)}
                                    className="text-[9px] md:text-[10px] font-bold text-orange-500 hover:text-orange-400 flex items-center gap-1 bg-orange-500/10 px-1.5 py-0.5 rounded transition-colors"
                                >
                                    <i className="ph-bold ph-ruler"></i> Cubagem
                                </button>
                            </div>
                            <div className="relative">
                              <input type="text" value={pesoInput} onChange={(e) => setPesoInput(e.target.value.replace(/[^0-9,]/g, ''))} placeholder="Ex: 0,5" className={`${theme.input} pl-2 pr-6`} />
                              <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                                <span className={`font-bold text-[10px] ${theme.icon}`}>kg</span>
                              </div>
                            </div>
                            
                            {/* CAIXA DE CUBAGEM */}
                            {showCubagem && (
                                <div className={`absolute z-30 bottom-full mb-1 w-full p-2 rounded-xl border shadow-xl animate-fade-in ${isDarkMode ? 'bg-slate-800 border-slate-600' : 'bg-white border-slate-300'}`}>
                                    <div className="flex justify-between items-center mb-1">
                                        <h4 className="text-[8px] font-bold text-orange-500 uppercase tracking-wider">Cubagem</h4>
                                        <button onClick={() => setShowCubagem(false)} className="text-slate-400 hover:text-slate-200"><i className="ph-bold ph-x text-xs"></i></button>
                                    </div>
                                    <div className="grid grid-cols-3 gap-1 mb-1.5">
                                        <div>
                                            <label className="text-[7px] font-bold uppercase text-slate-500 block mb-0.5">C (cm)</label>
                                            <input type="text" value={dimComprimento} onChange={(e) => setDimComprimento(e.target.value.replace(/[^0-9,]/g, ''))} className={`w-full p-0.5 text-[9px] rounded border outline-none focus:border-orange-500 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'}`} placeholder="0" />
                                        </div>
                                        <div>
                                            <label className="text-[7px] font-bold uppercase text-slate-500 block mb-0.5">L (cm)</label>
                                            <input type="text" value={dimLargura} onChange={(e) => setDimLargura(e.target.value.replace(/[^0-9,]/g, ''))} className={`w-full p-0.5 text-[9px] rounded border outline-none focus:border-orange-500 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'}`} placeholder="0" />
                                        </div>
                                        <div>
                                            <label className="text-[7px] font-bold uppercase text-slate-500 block mb-0.5">A (cm)</label>
                                            <input type="text" value={dimAltura} onChange={(e) => setDimAltura(e.target.value.replace(/[^0-9,]/g, ''))} className={`w-full p-0.5 text-[9px] rounded border outline-none focus:border-orange-500 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'}`} placeholder="0" />
                                        </div>
                                    </div>
                                    <div className="mb-1.5">
                                        <label className="text-[7px] font-bold uppercase text-slate-500 block mb-0.5">Balança (kg)</label>
                                        <input type="text" value={pesoFisico} onChange={(e) => setPesoFisico(e.target.value.replace(/[^0-9,]/g, ''))} className={`w-full p-0.5 text-[9px] rounded border outline-none focus:border-orange-500 ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'}`} placeholder="Ex: 1,5" />
                                    </div>
                                    <button onClick={aplicarCubagem} className="w-full py-1 bg-gradient-to-r from-orange-500 to-rose-500 hover:from-orange-600 hover:to-rose-600 text-white rounded text-[8px] font-bold shadow active:scale-95">
                                        Aplicar Maior Peso
                                    </button>
                                </div>
                            )}
                          </div>
                        </>
                      )}

                    </div>

                    {erro && (
                      <div className={theme.error}>
                        <i className="ph-fill ph-warning text-sm shrink-0"></i> {erro}
                      </div>
                    )}

                    <button onClick={calcular} className="mt-2 w-full py-1.5 md:py-2 bg-gradient-to-r from-orange-500 to-rose-500 hover:from-orange-600 hover:to-rose-600 text-white rounded-xl font-bold text-sm md:text-base shadow-lg shadow-orange-500/20 transform transition-all active:scale-95 flex justify-center items-center gap-1.5">
                      <i className="ph-bold ph-calculator text-base md:text-lg"></i> CALCULAR PREÇO IDEAL
                    </button>

                    {resultado && (
                      <div className="mt-2.5 animate-fade-in">
                        <div className={theme.resultCard}>
                          
                          <div className="absolute top-0 right-0 bg-green-500 text-white px-2 py-0.5 rounded-bl-lg font-bold text-[8px] flex items-center gap-1">
                            <i className="ph-fill ph-check-circle"></i> Seguro
                          </div>

                          <p className="text-slate-400 font-medium mb-0.5 uppercase tracking-wider text-[8px]">Sua Sugestão</p>
                          <h2 className="text-lg md:text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-300 mb-0.5">
                            R$ {resultado.precoSugerido.toFixed(2).replace('.', ',')}
                          </h2>
                          {resultado.precoSugerido >= 79 && platform === 'ML' && (
                              <p className="text-green-400 text-[8px] md:text-[9px] font-bold mb-1.5">✓ Frete Grátis Obrigatório</p>
                          )}
                          {resultado.precoSugerido < 79 && platform === 'ML' && (
                              <p className="text-slate-400 text-[8px] md:text-[9px] mb-1.5">
                                  {ofereceFreteGratis ? '✓ Frete Grátis Ativado' : 'Frete Padrão (Comprador paga)'}
                              </p>
                          )}

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1 text-[9px] md:text-[10px] mt-1.5">
                            
                            <div className={`flex justify-between items-center border-b pb-0.5 ${theme.resultItemBorder}`}>
                              <span className="text-slate-400">Custo+Emb:</span>
                              <span className="font-semibold text-slate-200">R$ {resultado.custoBase.toFixed(2).replace('.', ',')}</span>
                            </div>
                            
                            <div className={`flex justify-between items-center border-b pb-0.5 ${theme.resultItemBorder}`}>
                              <span className="text-slate-400">
                                {platform === 'ML' ? (
                                  <>Frete <span className="text-[7px] text-slate-500 block truncate max-w-[80px]" title={resultado.faixaAplicada}>({resultado.faixaAplicada})</span></>
                                ) : 'Taxa Fixa:'}
                              </span>
                              <span className="font-semibold text-red-400">- R$ {resultado.freteTaxa.toFixed(2).replace('.', ',')}</span>
                            </div>

                            {platform === 'ML' && resultado.taxaFixa > 0 && (
                                <div className={`flex justify-between items-center border-b pb-0.5 ${theme.resultItemBorder}`}>
                                  <span className="text-slate-400">Tarifa Fixa:</span>
                                  <span className="font-semibold text-red-400">- R$ {resultado.taxaFixa.toFixed(2).replace('.', ',')}</span>
                                </div>
                            )}

                            <div className={`flex justify-between items-center border-b pb-0.5 ${theme.resultItemBorder}`}>
                              <span className="text-slate-400">Comissão ({resultado.margemUsada.toFixed(0)}%):</span>
                              <span className="font-semibold text-red-400">- R$ {resultado.comissaoVenda.toFixed(2).replace('.', ',')}</span>
                            </div>

                            <div className={`flex justify-between items-center border-b pb-0.5 ${theme.resultItemBorder}`}>
                              <span className="text-slate-400">Impostos:</span>
                              <span className="font-semibold text-red-400">- R$ {resultado.valorImposto.toFixed(2).replace('.', ',')}</span>
                            </div>

                          </div>

                          <div className={theme.composicaoBg}>
                            <h3 className="text-slate-300 font-bold uppercase tracking-wide text-[7px] md:text-[8px] mb-1">Composição do Preço</h3>
                            <div className="space-y-0.5 text-[8px] md:text-[9px]">
                              <div className="flex justify-between">
                                <span className="text-slate-400">Fixos (Prod+Emb+Frete+Taxa)</span>
                                <span className="font-semibold text-slate-200">R$ {(resultado.custoBase + resultado.freteTaxa + resultado.taxaFixa).toFixed(2).replace('.', ',')}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-slate-400">Comissão App</span>
                                <span className="font-semibold text-slate-200">R$ {resultado.comissaoVenda.toFixed(2).replace('.', ',')}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-slate-400">Imposto</span>
                                <span className="font-semibold text-slate-200">R$ {resultado.valorImposto.toFixed(2).replace('.', ',')}</span>
                              </div>
                              <div className={`flex justify-between pt-0.5 border-t ${theme.resultItemBorder}`}>
                                <span className="text-slate-300 font-bold">Deduções Totais</span>
                                <span className="font-bold text-orange-400">
                                  {(resultado.margemUsada + (parsePercent(imposto) || 0) + (parsePercent(lucroDesejado) || 0)).toFixed(2).replace('.', ',')}%
                                </span>
                              </div>
                            </div>
                          </div>

                          <div className="mt-2 bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 flex items-center justify-between">
                            <div>
                              <p className="text-emerald-400 font-bold uppercase tracking-wider text-[8px] mb-0.5">Lucro Líquido</p>
                              <p className="text-base md:text-lg font-extrabold text-emerald-300">R$ {resultado.lucroLiq.toFixed(2).replace('.', ',')}</p>
                            </div>
                            <div className="text-right">
                              <p className="text-slate-400 font-medium text-[7px] mb-0.5">Margem</p>
                              <div className="bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded text-[10px] font-bold">
                                {resultado.lucroLiqPct.toFixed(1).replace('.', ',')}%
                              </div>
                            </div>
                          </div>

                        </div>
                      </div>
                    )}

                  </div>
                </div>

                <p className={`text-center text-[7px] md:text-[8px] mt-1 ${isDarkMode ? 'text-slate-600' : 'text-slate-500'}`}>
                  Atualizada: ML e Shopee 2026.
                </p>

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
