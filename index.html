<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precificação Pro - Adriano Santos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background-color: #0B1120; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://pttckajgbilxtlvhrdsm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0dGNrYWpnYmlseHRsdmhyZHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMzkyMDYsImV4cCI6MjA4Nzc0NTIwNn0.8buGbTrL0_nsFW9B0JPf_PyFeYbvAbe2UjMISpdQ6Os';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('Calculadora@123');
            const [showPassword, setShowPassword] = useState(false);
            const [authError, setAuthError] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setAuthError('');
                try {
                    const { error } = await supabase.auth.signInWithPassword({ 
                        email: email.trim(), 
                        password: password 
                    });
                    if (error) throw error;
                    setIsLoggedIn(true);
                } catch (err) {
                    setAuthError('E-mail ou senha incorretos.');
                } finally {
                    setIsLoading(false);
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="w-full max-w-md bg-[#111827] border border-slate-800 rounded-3xl p-8 shadow-2xl animate-fade-in">
                            <div className="text-center mb-8">
                                <img src="logo.png" className="mx-auto h-20 mb-4 drop-shadow-[0_0_15px_rgba(249,115,22,0.3)]" onError={(e) => e.target.src='https://placehold.co/80x80/orange/white?text=AS'} />
                                <h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-400">Acesso Exclusivo</h1>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="text-xs font-bold uppercase text-slate-400 ml-1">E-mail</label>
                                    <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 px-4 outline-none focus:ring-2 focus:ring-orange-500" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold uppercase text-slate-400 ml-1">Senha</label>
                                    <div className="relative">
                                        <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 px-4 outline-none focus:ring-2 focus:ring-orange-500" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500">
                                            <i className={showPassword ? "ph ph-eye-closed text-xl" : "ph ph-eye text-xl"}></i>
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-2">Aviso: Use o e-mail da compra. Senha: <span className="text-orange-400">Calculadora@123</span></p>
                                </div>
                                {authError && <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm font-medium">{authError}</div>}
                                <button type="submit" disabled={isLoading} className="w-full py-4 bg-gradient-to-r from-orange-500 to-rose-500 text-white rounded-xl font-bold shadow-lg disabled:opacity-50 transition-all active:scale-95">
                                    {isLoading ? "Carregando..." : "Entrar"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen text-white flex flex-col items-center justify-center p-10">
                    <h1 className="text-4xl font-bold mb-4">Calculadora Logada!</h1>
                    <button onClick={() => setIsLoggedIn(false)} className="px-6 py-2 bg-slate-800 rounded-lg text-orange-400 hover:bg-slate-700">Sair</button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
