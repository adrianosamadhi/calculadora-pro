<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precificação Pro - Adriano Santos</title>
    <link rel="manifest" href="manifest.json?v=4">
    <link rel="apple-touch-icon" href="icone-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background-color: #0B1120; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // --- ESTADOS DE LOGIN ---
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('Calculadora@123');
            const [showPassword, setShowPassword] = useState(false);
            const [authError, setAuthError] = useState('');

            // --- ESTADOS DA CALCULADORA ---
            const [custo, setCusto] = useState(15.00);
            const [embalagem, setEmbalagem] = useState(0.00);
            const [frete, setFrete] = useState(12.87);
            const [imposto, setImposto] = useState(8.20);
            const [margem, setMargem] = useState(15.00);
            const [taxaBase, setTaxaBase] = useState(14.00); // Taxa da categoria Clássico
            
            // --- CHAVES DE CONFIGURAÇÃO ---
            const [isPremium, setIsPremium] = useState(false);
            const [isMei, setIsMei] = useState(false);
            const [ofereceFreteGratis, setOfereceFreteGratis] = useState(false);

            // --- ESTADOS DE RESULTADO ---
            const [precoIdeal, setPrecoIdeal] = useState(0);
            const [detalhes, setDetalhes] = useState({ taxaML: 0, valorImposto: 0, lucro: 0, taxaFixa: 0, freteAplicado: 0 });

            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                if (password === 'Calculadora@123' || password === '735589') {
                    setIsLoggedIn(true);
                } else {
                    setAuthError('E-mail ou senha incorretos. Verifique os dados.');
                }
            };

            // --- LÓGICA MATEMÁTICA DO MERCADO LIVRE ---
            useEffect(() => {
                calcularPreco();
            }, [custo, embalagem, frete, imposto, margem, taxaBase, isPremium, isMei, ofereceFreteGratis]);

            const calcularPreco = () => {
                // 1. Definir Porcentagens
                const impostoAplicado = isMei ? 0 : (imposto / 100);
                const comissaoAplicada = (taxaBase / 100) + (isPremium ? 0.05 : 0); // Premium geralmente cobra +5% (Ex: 14% vai pra 19%)
                const margemAplicada = margem / 100;
                const denominador = 1 - comissaoAplicada - impostoAplicado - margemAplicada;

                if (denominador <= 0) {
                    setPrecoIdeal(0);
                    return; // Margem inviável
                }

                // 2. Simulação 1: Tentativa de Preço Abaixo de R$ 79
                let custoFixoAbaixo79 = custo + embalagem + (ofereceFreteGratis ? frete : 0) + 6.75; // 6.75 é a taxa fixa do ML
                let precoAbaixo79 = custoFixoAbaixo79 / denominador;

                // 3. Simulação 2: Preço Acima de R$ 79 (Frete obrigatório, sem taxa fixa)
                let custoFixoAcima79 = custo + embalagem + frete;
                let precoAcima79 = custoFixoAcima79 / denominador;

                // 4. Decisão da Regra de Negócio
                let precoFinal = 0;
                let taxaFixaCobrada = 0;
                let freteCobrado = 0;

                if (precoAbaixo79 < 79) {
                    precoFinal = precoAbaixo79;
                    taxaFixaCobrada = 6.75;
                    freteCobrado = ofereceFreteGratis ? frete : 0;
                } else {
                    precoFinal = precoAcima79;
                    taxaFixaCobrada = 0;
                    freteCobrado = frete;
                }

                setPrecoIdeal(precoFinal);
                setDetalhes({
                    taxaML: precoFinal * comissaoAplicada,
                    valorImposto: precoFinal * impostoAplicado,
                    lucro: precoFinal * margemAplicada,
                    taxaFixa: taxaFixaCobrada,
                    freteAplicado: freteCobrado
                });
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                        <div className="w-full max-w-[440px] bg-[#111827] border border-slate-800 rounded-3xl p-10 shadow-2xl relative z-10 animate-fade-in">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-400 mt-4">Acesso Exclusivo</h1>
                                <p className="text-slate-400 text-sm mt-2">Faça login para usar a Calculadora Pro.</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div className="space-y-2">
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400">E-mail</label>
                                    <div className="relative">
                                        <i className="ph ph-envelope-simple absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seu@email.com" className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-4 focus:ring-2 focus:ring-orange-500 outline-none transition-all" />
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Senha</label>
                                    <div className="relative">
                                        <i className="ph ph-key absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                                        <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-12 focus:ring-2 focus:ring-orange-500 outline-none transition-all" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500 hover:text-white transition-colors">
                                            <i className={showPassword ? "ph ph-eye-closed text-xl" : "ph ph-eye text-xl"}></i>
                                        </button>
                                    </div>
                                    <p className="text-[12px] text-slate-400 mt-2 flex items-start gap-1.5 leading-snug">
                                        <i className="ph-fill ph-info text-orange-500 mt-0.5 shrink-0"></i> 
                                        <span>Aviso: Use o e-mail da compra. Senha: <strong className="text-orange-400">Calculadora@123</strong></span>
                                    </p>
                                </div>
                                {authError && <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm flex items-center gap-2"><i className="ph ph-warning-circle"></i>{authError}</div>}
                                <button type="submit" className="w-full py-4 bg-gradient-to-r from-orange-500 to-rose-500 text-white rounded-xl font-bold shadow-lg transition-all active:scale-95">
                                    Entrar no Sistema
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-6 text-white animate-fade-in relative max-w-6xl mx-auto">
                    
                    <div className="flex justify-between items-center mb-8">
                        <h1 className="text-2xl font-bold text-orange-400 flex items-center gap-2">
                            <i className="ph-fill ph-calculator"></i> Calculadora Turbo
                        </h1>
                        <button onClick={() => setIsLoggedIn(false)} className="px-5 py-2 bg-slate-800 rounded-lg text-sm hover:bg-slate-700 transition-colors font-semibold">Sair</button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* COLUNA ESQUERDA: CONFIGURAÇÕES E INPUTS (Ocupa 7 colunas) */}
                        <div className="lg:col-span-7 bg-[#111827] p-8 rounded-2xl border border-slate-800 shadow-xl">
                            <h2 className="text-lg font-bold mb-6 text-slate-300 flex items-center gap-2">
                                <i className="ph ph-sliders-horizontal text-orange-500"></i> Estratégia de Venda
                            </h2>
                            
                            {/* Checkboxes */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 bg-[#0B1120] p-5 rounded-xl border border-slate-800">
                                <label className="flex items-center gap-3 cursor-pointer group">
                                    <input type="checkbox" checked={isPremium} onChange={(e) => setIsPremium(e.target.checked)} className="w-5 h-5 accent-orange-500 rounded cursor-pointer" />
                                    <span className="text-sm font-semibold group-hover:text-orange-400 transition-colors">Anúncio Premium <span className="text-xs text-slate-500 block font-normal">(+ Comissão, + Exposição)</span></span>
                                </label>
                                
                                <label className="flex items-center gap-3 cursor-pointer group">
                                    <input type="checkbox" checked={ofereceFreteGratis} onChange={(e) => setOfereceFreteGratis(e.target.checked)} className="w-5 h-5 accent-orange-500 rounded cursor-pointer" />
                                    <span className="text-sm font-semibold group-hover:text-orange-400 transition-colors">Oferecer Frete Grátis <span className="text-xs text-slate-500 block font-normal">(Abaixo de R$ 79)</span></span>
                                </label>

                                <label className="flex items-center gap-3 cursor-pointer group sm:col-span-2 mt-2">
                                    <input type="checkbox" checked={isMei} onChange={(e) => setIsMei(e.target.checked)} className="w-5 h-5 accent-orange-500 rounded cursor-pointer" />
                                    <span className="text-sm font-semibold text-emerald-400">Sou MEI <span className="text-xs text-slate-500 block font-normal">(Zera a alíquota de imposto no cálculo)</span></span>
                                </label>
                            </div>

                            {/* Inputs de Valores */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Custo do Produto (R$)</label>
                                    <div className="relative mt-1">
                                        <span className="absolute left-3 top-3 text-slate-500">R$</span>
                                        <input type="number" value={custo} onChange={(e) => setCusto(Number(e.target.value))} className="w-full bg-[#030712] border border-slate-800 rounded-lg py-3 pl-10 pr-3 outline-none focus:border-orange-500 font-mono text-lg transition-colors" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Custo de Frete (R$)</label>
                                    <div className="relative mt-1">
                                        <span className="absolute left-3 top-3 text-slate-500">R$</span>
                                        <input type="number" value={frete} onChange={(e) => setFrete(Number(e.target.value))} className="w-full bg-[#030712] border border-slate-800 rounded-lg py-3 pl-10 pr-3 outline-none focus:border-orange-500 font-mono text-lg transition-colors" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Embalagem/Outros (R$)</label>
                                    <div className="relative mt-1">
                                        <span className="absolute left-3 top-3 text-slate-500">R$</span>
                                        <input type="number" value={embalagem} onChange={(e) => setEmbalagem(Number(e.target.value))} className="w-full bg-[#030712] border border-slate-800 rounded-lg py-3 pl-10 pr-3 outline-none focus:border-orange-500 font-mono text-lg transition-colors" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Taxa da Categoria Clássico (%)</label>
                                    <div className="relative mt-1">
                                        <input type="number" value={taxaBase} onChange={(e) => setTaxaBase(Number(e.target.value))} className="w-full bg-[#030712] border border-slate-800 rounded-lg py-3 px-3 pr-8 outline-none focus:border-orange-500 font-mono text-lg transition-colors" />
                                        <span className="absolute right-3 top-3 text-slate-500">%</span>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Lucro Líquido Desejado (%)</label>
                                    <div className="relative mt-1">
                                        <input type="number" value={margem} onChange={(e) => setMargem(Number(e.target.value))} className="w-full bg-[#030712] border border-orange-500/50 rounded-lg py-3 px-3 pr-8 outline-none focus:border-orange-500 font-mono text-lg text-orange-400 transition-colors" />
                                        <span className="absolute right-3 top-3 text-orange-500/50">%</span>
                                    </div>
                                </div>
                                <div className={isMei ? "opacity-30 pointer-events-none" : ""}>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Imposto ({isMei ? 'Isento' : 'Simples Nacional'})</label>
                                    <div className="relative mt-1">
                                        <input type="number" value={imposto} onChange={(e) => setImposto(Number(e.target.value))} disabled={isMei} className="w-full bg-[#030712] border border-slate-800 rounded-lg py-3 px-3 pr-8 outline-none focus:border-orange-500 font-mono text-lg transition-colors" />
                                        <span className="absolute right-3 top-3 text-slate-500">%</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* COLUNA DIREITA: RESULTADOS (Ocupa 5 colunas) */}
                        <div className="lg:col-span-5 bg-gradient-to-br from-slate-900 to-[#0B1120] p-8 rounded-2xl border border-slate-800 shadow-xl flex flex-col relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-rose-500"></div>
                            
                            <h3 className="text-slate-400 font-bold uppercase tracking-widest text-sm mb-6 flex items-center gap-2">
                                <i className="ph-fill ph-check-circle text-emerald-500"></i> Preço Ideal de Venda
                            </h3>
                            
                            <div className="text-center mb-8">
                                <p className="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500 tabular-nums">
                                    {precoIdeal > 0 ? `R$ ${precoIdeal.toFixed(2).replace('.', ',')}` : "Erro"}
                                </p>
                                {precoIdeal >= 79 && (
                                    <span className="inline-block mt-3 px-3 py-1 bg-green-500/10 text-green-400 text-xs font-bold rounded-full border border-green-500/20">
                                        Frete Grátis Obrigatório Ativado
                                    </span>
                                )}
                            </div>

                            <div className="flex-1"></div>

                            {/* Resumo Financeiro */}
                            <div className="space-y-3 bg-[#111827] p-5 rounded-xl border border-slate-800/50">
                                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Resumo dos Custos</h4>
                                
                                <div className="flex justify-between text-sm">
                                    <span className="text-slate-400">Produto + Embalagem</span>
                                    <span className="font-mono">R$ {(custo + embalagem).toFixed(2).replace('.', ',')}</span>
                                </div>
                                <div className="flex justify-between text-sm">
                                    <span className="text-slate-400">Comissão ML ({isPremium ? 'Premium' : 'Clássico'})</span>
                                    <span className="font-mono text-rose-400">- R$ {detalhes.taxaML.toFixed(2).replace('.', ',')}</span>
                                </div>
                                {detalhes.taxaFixa > 0 && (
                                    <div className="flex justify-between text-sm">
                                        <span className="text-slate-400">Taxa Fixa (Abaixo R$ 79)</span>
                                        <span className="font-mono text-rose-400">- R$ {detalhes.taxaFixa.toFixed(2).replace('.', ',')}</span>
                                    </div>
                                )}
                                {detalhes.freteAplicado > 0 && (
                                    <div className="flex justify-between text-sm">
                                        <span className="text-slate-400">Seu Custo de Frete</span>
                                        <span className="font-mono text-rose-400">- R$ {detalhes.freteAplicado.toFixed(2).replace('.', ',')}</span>
                                    </div>
                                )}
                                {!isMei && (
                                    <div className="flex justify-between text-sm">
                                        <span className="text-slate-400">Imposto ({imposto}%)</span>
                                        <span className="font-mono text-rose-400">- R$ {detalhes.valorImposto.toFixed(2).replace('.', ',')}</span>
                                    </div>
                                )}
                                <div className="pt-3 mt-3 border-t border-slate-700/50 flex justify-between items-center">
                                    <span className="text-sm font-bold text-orange-400">Seu Lucro Líquido ({margem}%)</span>
                                    <span className="font-mono font-bold text-lg text-orange-400">R$ {detalhes.lucro.toFixed(2).replace('.', ',')}</span>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
