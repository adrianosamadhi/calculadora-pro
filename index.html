<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precificação Pro - Adriano Santos</title>
    <link rel="manifest" href="manifest.json?v=3">
    <link rel="apple-touch-icon" href="icone-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background-color: #0B1120; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('Calculadora@123');
            const [showPassword, setShowPassword] = useState(false);
            const [authError, setAuthError] = useState('');

            // --- ESTADOS DA CALCULADORA TURBO ---
            const [custo, setCusto] = useState(15.00);
            const [frete, setFrete] = useState(12.87);
            const [margem, setMargem] = useState(15);
            const [imposto, setImposto] = useState(8.20);
            const [taxaML, setTaxaML] = useState(14);
            
            // Checkboxes (As "Chaves" que você pediu)
            const [isPremium, setIsPremium] = useState(false);
            const [isMei, setIsMei] = useState(false);
            const [ofereceFreteGratis, setOfereceFreteGratis] = useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                
                // Login Simples e Funcional (Bypass do erro do Supabase)
                if (password === 'Calculadora@123' || password === '735589') {
                    setIsLoggedIn(true);
                } else {
                    setAuthError('E-mail ou senha incorretos. Verifique os dados.');
                }
            };

            // SE NÃO ESTIVER LOGADO: MOSTRA A TELA DE LOGIN ESCURA E BONITA
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                        <div className="w-full max-w-[440px] bg-[#111827] border border-slate-800 rounded-3xl p-10 shadow-2xl relative z-10 animate-fade-in">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-400 mt-4">Acesso Exclusivo</h1>
                                <p className="text-slate-400 text-sm mt-2">Faça login para usar a Calculadora Pro.</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div className="space-y-2">
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400">E-mail</label>
                                    <div className="relative">
                                        <i className="ph ph-envelope-simple absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seu@email.com" className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-4 focus:ring-2 focus:ring-orange-500 outline-none transition-all" />
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Senha</label>
                                    <div className="relative">
                                        <i className="ph ph-key absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                                        <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-12 focus:ring-2 focus:ring-orange-500 outline-none transition-all" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500 hover:text-white transition-colors">
                                            <i className={showPassword ? "ph ph-eye-closed text-xl" : "ph ph-eye text-xl"}></i>
                                        </button>
                                    </div>
                                    <p className="text-[12px] text-slate-400 mt-2 flex items-start gap-1.5 leading-snug">
                                        <i className="ph-fill ph-info text-orange-500 mt-0.5 shrink-0"></i> 
                                        <span>Aviso: Use o e-mail da compra. Senha: <strong className="text-orange-400">Calculadora@123</strong></span>
                                    </p>
                                </div>
                                {authError && <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm flex items-center gap-2"><i className="ph ph-warning-circle"></i>{authError}</div>}
                                <button type="submit" className="w-full py-4 bg-gradient-to-r from-orange-500 to-rose-500 text-white rounded-xl font-bold shadow-lg transition-all active:scale-95">
                                    Entrar
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // SE ESTIVER LOGADO: MOSTRA A CALCULADORA TURBO
            return (
                <div className="min-h-screen p-6 text-white animate-fade-in relative">
                    <div className="max-w-4xl mx-auto">
                        
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-2xl font-bold text-orange-400">Calculadora de Precificação Turbo</h1>
                            <button onClick={() => setIsLoggedIn(false)} className="px-4 py-2 bg-slate-800 rounded-lg text-sm hover:bg-slate-700">Sair</button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            
                            {/* COLUNA ESQUERDA: CHECKBOXES E INPUTS */}
                            <div className="bg-[#111827] p-6 rounded-2xl border border-slate-800">
                                <h2 className="text-lg font-bold mb-4 text-slate-300">Configurações do Anúncio</h2>
                                
                                <div className="space-y-4 mb-6">
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="checkbox" checked={isPremium} onChange={(e) => setIsPremium(e.target.checked)} className="w-5 h-5 accent-orange-500" />
                                        <span className="text-sm font-semibold">Anúncio Premium (Maior conversão e comissão)</span>
                                    </label>
                                    
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="checkbox" checked={ofereceFreteGratis} onChange={(e) => setOfereceFreteGratis(e.target.checked)} className="w-5 h-5 accent-orange-500" />
                                        <span className="text-sm font-semibold">Oferecer Frete Grátis (Desconto do seu bolso)</span>
                                    </label>

                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="checkbox" checked={isMei} onChange={(e) => setIsMei(e.target.checked)} className="w-5 h-5 accent-orange-500" />
                                        <span className="text-sm font-semibold">Sou MEI (Imposto 0% na venda)</span>
                                    </label>
                                </div>

                                <hr className="border-slate-800 my-6" />

                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400">Custo do Produto (R$)</label>
                                        <input type="number" value={custo} onChange={(e) => setCusto(Number(e.target.value))} className="w-full mt-1 bg-[#030712] border border-slate-800 rounded-lg py-2 px-3 outline-none focus:border-orange-500" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-400">Margem Líquida (%)</label>
                                            <input type="number" value={margem} onChange={(e) => setMargem(Number(e.target.value))} className="w-full mt-1 bg-[#030712] border border-slate-800 rounded-lg py-2 px-3 outline-none focus:border-orange-500" />
                                        </div>
                                        {!isMei && (
                                            <div>
                                                <label className="text-xs font-bold text-slate-400">Imposto (%)</label>
                                                <input type="number" value={imposto} onChange={(e) => setImposto(Number(e.target.value))} className="w-full mt-1 bg-[#030712] border border-slate-800 rounded-lg py-2 px-3 outline-none focus:border-orange-500" />
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* COLUNA DIREITA: RESULTADOS */}
                            <div className="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col justify-center items-center text-center">
                                <h3 className="text-slate-400 font-bold uppercase tracking-widest text-sm mb-2">Preço Ideal de Venda</h3>
                                <p className="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500">
                                    R$ --,--
                                </p>
                                <p className="text-sm text-slate-400 mt-4 max-w-xs">
                                    A lógica matemática será conectada aqui no próximo passo para calcularmos Clássico vs Premium perfeitamente!
                                </p>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
