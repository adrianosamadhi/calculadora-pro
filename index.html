<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precificação Pro - Adriano Santos</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icone-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #374151; }
        
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
          animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // CONFIGURAÇÕES DO SUPABASE (CORRIGIDAS!)
        // ==========================================
        const supabaseUrl = 'https://pttckajgbilxtlvhrdsm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0dGNrYWpnYmlseHRsdmhyZHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMzkyMDYsImV4cCI6MjA4Nzc0NTIwNn0.8buGbTrL0_nsFW9B0JPf_PyFeYbvAbe2UjMISpdQ6Os';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const mlRates = {
          "Até 0,3 kg": [5.65, 6.35, 7.75, 12.35, 13.35, 15.45, 16.45, 20.95],
          "De 0,3 a 0,5 kg": [5.95, 6.75, 7.95, 13.25, 15.45, 17.65, 18.85, 23.55],
          "De 0,5 a 1 kg": [6.05, 6.75, 7.95, 14.15, 19.85, 18.45, 19.85, 22.65],
          "De 1 a 1,5 kg": [6.15, 6.85, 8.15, 14.45, 18.45, 19.45, 21.15, 24.65],
          "De 1,5 a 2 kg": [6.35, 6.75, 8.15, 15.75, 19.33, 21.05, 22.65, 25.55],
          "De 2 a 3 kg": [6.35, 7.95, 9.95, 14.85, 21.05, 22.65, 25.65, 26.25],
          "De 3 a 4 kg": [6.35, 8.15, 9.95, 15.85, 28.65, 27.75, 27.75, 33.55],
          "De 4 a 5 kg": [6.95, 8.25, 10.15, 25.55, 28.65, 28.65, 30.75, 40.05],
          "De 5 a 7 kg": [6.65, 8.95, 10.33, 27.65, 31.45, 33.65, 37.65, 43.25],
          "De 6 a 7 kg": [6.75, 9.35, 11.35, 31.55, 38.65, 36.05, 32.65, 50.65],
          "De 7 a 8 kg": [6.75, 9.25, 11.33, 28.95, 54.35, 55.05, 42.65, 54.35],
          "De 9 a 11 kg": [7.23, 9.15, 11.33, 42.15, 54.65, 59.35, 59.45, 69.65],
          "De 13 a 15 kg": [7.25, 10.15, 11.33, 52.45, 59.95, 67.45, 67.45, 75.95]
        };

        const mlPriceTiers = [18.99, 38.99, 78.99, 98.99, 119.99, 149.99, 199.99, Infinity];
        const mlTierNames = ["Até R$ 18,99", "R$ 19 a R$ 38,99", "R$ 39 a R$ 78,99", "R$ 79 a R$ 98,99", "R$ 100 a R$ 119,99", "R$ 120 a R$ 149,99", "R$ 150 a R$ 199,99", "Acima de R$ 200"];

        const formatCurrency = (value) => {
          if (!value) return "0,00";
          const numericValue = value.replace(/\D/g, "");
          const floatValue = (Number(numericValue) / 100).toFixed(2);
          return floatValue.replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };

        const parseCurrency = (val) => Number(val.replace(/\./g, '').replace(',', '.')) || 0;
        const parsePercent = (val) => Number(val.replace(',', '.')) || 0;

        function App() {
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('Calculadora@123'); 
          const [authError, setAuthError] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const [isCheckingSession, setIsCheckingSession] = useState(true);

          const [isDarkMode, setIsDarkMode] = useState(true);
          const [platform, setPlatform] = useState('ML');
          const [custoProduto, setCustoProduto] = useState('');
          const [embalagem, setEmbalagem] = useState('');
          const [imposto, setImposto] = useState('');
          const [lucroDesejado, setLucroDesejado] = useState('20');
          
          const [tipoAnuncio, setTipoAnuncio] = useState('11.5');
          const [freteGratis, setFreteGratis] = useState(false);
          const [pesoProduto, setPesoProduto] = useState('De 1 a 1,5 kg');
          
          const [resultado, setResultado] = useState(null);
          const [erro, setErro] = useState(null);

          useEffect(() => {
              document.documentElement.classList.toggle('dark', isDarkMode);
          }, [isDarkMode]);

          useEffect(() => {
            supabase.auth.getSession().then(({ data: { session } }) => {
              setIsLoggedIn(!!session);
              setIsCheckingSession(false);
            });
            const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
              setIsLoggedIn(!!session);
            });
            return () => subscription.unsubscribe();
          }, []);

          const handleLogin = async (e) => {
            e.preventDefault();
            setIsLoading(true);
            setAuthError('');
            const { error } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
            if (error) {
              setAuthError('E-mail ou senha incorretos. Verifique o e-mail da compra.');
            }
            setIsLoading(false);
          };

          const handleLogout = async () => {
            await supabase.auth.signOut();
            setIsLoggedIn(false);
            setResultado(null);
          };

          const handleCurrencyChange = (setter) => (e) => setter(formatCurrency(e.target.value));
          const handlePercentChange = (setter) => (e) => setter(e.target.value.replace(/[^0-9,]/g, ''));

          const calcular = () => {
            setErro(null);
            setResultado(null);
            const custo = parseCurrency(custoProduto);
            const emb = parseCurrency(embalagem);
            const impostoPct = parsePercent(imposto) / 100;
            const lucroPct = parsePercent(lucroDesejado) / 100;

            if (custo === 0) return setErro("Por favor, insira o Custo do Produto.");

            let melhorPreco = null;
            let detalhesCalculo = null;

            for (let p = custo + emb; p <= 15000; p += 0.01) {
              let comissaoVenda = 0, custoFixoFrete = 0, taxaFixaML = 0, freteVendedorML = 0;
              let comissaoPctReal = platform === 'SHOPEE' ? 0.20 : parseFloat(tipoAnuncio) / 100;

              if (platform === 'SHOPEE') {
                if (p > 79.99) comissaoPctReal = 0.14;
                custoFixoFrete = p <= 79.99 ? 4 : p <= 99.99 ? 16 : p <= 199.99 ? 20 : 26;
                comissaoVenda = p * comissaoPctReal;
              } else {
                comissaoVenda = p * comissaoPctReal;
                let tierIdx = mlPriceTiers.findIndex(t => p <= t);
                if (tierIdx === -1) tierIdx = mlPriceTiers.length - 1;
                if (p < 79) taxaFixaML = 6.75;
                if (freteGratis || p >= 79) freteVendedorML = mlRates[pesoProduto][tierIdx];
                custoFixoFrete = taxaFixaML + freteVendedorML;
              }

              const valorImposto = p * impostoPct;
              const lucroAtual = p - (custo + emb + custoFixoFrete + comissaoVenda + valorImposto);

              if (lucroAtual / p >= lucroPct) {
                melhorPreco = p;
                detalhesCalculo = {
                  custoBase: custo + emb, freteTaxa: custoFixoFrete, taxaFixaML, freteVendedorML,
                  comissaoVenda, valorImposto, lucroLiq: lucroAtual, lucroLiqPct: (lucroAtual / p) * 100,
                  margemUsada: comissaoPctReal * 100, faixaAplicada: mlTierNames[mlPriceTiers.findIndex(t => p <= t)]
                };
                break;
              }
            }
            melhorPreco ? setResultado({ precoSugerido: melhorPreco, ...detalhesCalculo }) : setErro("Cálculo inviável.");
          };

          if (isCheckingSession) return <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center text-slate-400"><div className="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-4"></div>Verificando segurança...</div>;

          if (!isLoggedIn) {
            return (
              <div className="min-h-screen bg-[#0B1120] flex flex-col items-center justify-center p-4 relative overflow-hidden">
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                <div className="w-full max-w-[420px] bg-[#111827] border border-slate-800 rounded-3xl p-8 md:p-10 shadow-2xl relative z-10 animate-fade-in">
                  <div className="text-center mb-8">
                    <img src="logo.png" alt="Logo" className="mx-auto h-20 mb-4 object-contain rounded-xl drop-shadow-[0_0_15px_rgba(249,115,22,0.3)]" onError={(e) => { e.target.style.display='none'; document.getElementById('lock-icon').style.display='flex'; }} />
                    <div id="lock-icon" style={{display: 'none'}} className="w-16 h-16 bg-gradient-to-br from-orange-500 to-rose-500 rounded-2xl mx-auto items-center justify-center mb-6 shadow-lg"><i className="ph-fill ph-lock-key text-white text-3xl"></i></div>
                    <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-400">Acesso Exclusivo</h1>
                    <p className="text-slate-400 text-sm mt-2">Faça login para usar a Calculadora Pro.</p>
                  </div>
                  <form onSubmit={handleLogin} className="space-y-5">
                    <div className="space-y-2">
                      <label className="text-xs font-bold uppercase tracking-wider text-slate-400">E-mail</label>
                      <div className="relative"><i className="ph ph-envelope-simple absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seu@email.com" className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-4 outline-none focus:ring-2 focus:ring-orange-500" />
                      </div>
                    </div>
                    <div className="space-y-2">
                      <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Senha</label>
                      <div className="relative"><i className="ph ph-key absolute left-4 top-3.5 text-slate-500 text-lg"></i>
                        <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-[#030712] border border-slate-800 text-white rounded-xl py-3 pl-11 pr-4 outline-none focus:ring-2 focus:ring-orange-500" />
                      </div>
                      <p className="text-[12px] text-slate-400 mt-2 flex items-start gap-1.5"><i className="ph-fill ph-info text-orange-500 mt-0.5"></i><span>Aviso: Use o e-mail da compra. Senha padrão: <strong className="text-orange-400">Calculadora@123</strong></span></p>
                    </div>
                    {authError && <div className="p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm font-medium">{authError}</div>}
                    <button type="submit" disabled={isLoading} className="w-full py-4 bg-gradient-to-r from-orange-500 to-rose-500 text-white rounded-xl font-bold shadow-lg active:scale-95 disabled:opacity-70">{isLoading ? "Autenticando..." : "Entrar no Sistema"}</button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen py-10 px-4 bg-slate-950 text-slate-200 font-sans animate-fade-in">
              <div className="max-w-4xl mx-auto relative">
                <div className="absolute top-0 right-0 flex gap-3"><button onClick={() => setIsDarkMode(!isDarkMode)} className="p-3 rounded-full bg-slate-800 text-yellow-400 shadow-lg"><i className={isDarkMode ? "ph-fill ph-sun" : "ph-fill ph-moon"}></i></button><button onClick={handleLogout} className="p-3 rounded-full bg-red-500/10 text-red-400 shadow-lg"><i className="ph-fill ph-lock-key"></i></button></div>
                <div className="text-center mb-10 pt-16 md:pt-0"><h1 className="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-rose-400 mb-2">Calculadora de Precificação</h1><p className="text-lg font-medium text-slate-400">Bem-vindo, Adriano Santos</p></div>
                <div className="rounded-3xl shadow-2xl overflow-hidden border border-slate-800 bg-slate-900">
                  <div className="flex w-full">
                    <button onClick={() => setPlatform('ML')} className={`flex-1 py-5 text-lg font-bold flex justify-center items-center gap-2 ${platform === 'ML' ? 'bg-yellow-400 text-yellow-950 border-b-4 border-yellow-600' : 'bg-slate-950 text-slate-500'}`}><i className="ph ph-tote"></i> Mercado Livre</button>
                    <button onClick={() => setPlatform('SHOPEE')} className={`flex-1 py-5 text-lg font-bold flex justify-center items-center gap-2 ${platform === 'SHOPEE' ? 'bg-orange-500 text-white border-b-4 border-orange-700' : 'bg-slate-950 text-slate-500'}`}><i className="ph ph-tote"></i> Shopee</button>
                  </div>
                  <div className="p-6 md:p-10">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="space-y-2"><label className="text-xs font-bold uppercase text-slate-400">Custo Produto (R$)</label><input type="text" value={custoProduto} onChange={handleCurrencyChange(setCustoProduto)} className="w-full py-3 bg-slate-950 border border-slate-700 rounded-xl px-4 text-white" /></div>
                      <div className="space-y-2"><label className="text-xs font-bold uppercase text-slate-400">Embalagem (R$)</label><input type="text" value={embalagem} onChange={handleCurrencyChange(setEmbalagem)} className="w-full py-3 bg-slate-950 border border-slate-700 rounded-xl px-4 text-white" /></div>
                      <div className="space-y-2"><label className="text-xs font-bold uppercase text-slate-400">Imposto (%)</label><input type="text" value={imposto} onChange={handlePercentChange(setImposto)} className="w-full py-3 bg-slate-950 border border-slate-700 rounded-xl px-4 text-white" /></div>
                      <div className="space-y-2"><label className="text-xs font-bold uppercase text-orange-500">Lucro Desejado (%)</label><input type="text" value={lucroDesejado} onChange={handlePercentChange(setLucroDesejado)} className="w-full py-3 bg-orange-500/10 border border-orange-500/30 rounded-xl px-4 text-orange-400" /></div>
                      {platform === 'ML' && (
                        <div className="col-span-full grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                           <div className="space-y-2 col-span-full"><label className="text-xs font-bold uppercase text-slate-400">Tipo de Anúncio</label>
                            <div className="flex gap-3">
                              <button onClick={() => setTipoAnuncio('11.5')} className={`flex-1 py-3 rounded-xl font-bold ${tipoAnuncio === '11.5' ? 'bg-yellow-500 text-yellow-950 ring-2 ring-yellow-400' : 'bg-slate-950 text-slate-400'}`}>Clássico (~11.5%)</button>
                              <button onClick={() => setTipoAnuncio('16.5')} className={`flex-1 py-3 rounded-xl font-bold ${tipoAnuncio === '16.5' ? 'bg-yellow-500 text-yellow-950 ring-2 ring-yellow-400' : 'bg-slate-950 text-slate-400'}`}>Premium (~16.5%)</button>
                            </div>
                           </div>
                           <div className="space-y-2"><label className="text-xs font-bold uppercase text-slate-400">Peso</label><select value={pesoProduto} onChange={(e) => setPesoProduto(e.target.value)} className="w-full py-3 bg-slate-950 border border-slate-700 rounded-xl px-4 text-white appearance-none">{Object.keys(mlRates).map(p => <option key={p} value={p}>{p}</option>)}</select></div>
                           <div className="flex items-center justify-between p-4 bg-slate-950 border border-slate-700 rounded-xl h-[54px] mt-6"><span className="font-bold text-xs uppercase">Frete Grátis</span><button onClick={() => setFreteGratis(!freteGratis)} className={`w-12 h-6 rounded-full transition-colors relative ${freteGratis ? 'bg-green-500' : 'bg-slate-700'}`}><span className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-transform ${freteGratis ? 'left-7' : 'left-1'}`}></span></button></div>
                        </div>
                      )}
                    </div>
                    {erro && <div className="mt-6 p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 font-medium flex gap-2"><i className="ph-fill ph-warning-circle text-xl"></i>{erro}</div>}
                    <button onClick={calcular} className="mt-8 w-full py-4 bg-gradient-to-r from-orange-500 to-rose-500 text-white rounded-xl font-bold text-xl shadow-lg active:scale-95">CALCULAR PREÇO IDEAL</button>
                    {resultado && (
                      <div className="mt-10 p-8 border border-slate-800 bg-slate-950 rounded-2xl animate-fade-in relative overflow-hidden">
                        <div className="absolute top-0 right-0 bg-green-500 text-white px-4 py-1 rounded-bl-xl font-bold text-sm">Precificação Segura</div>
                        <p className="text-slate-500 text-sm uppercase font-bold mb-1">Sugestão de Venda</p>
                        <h2 className="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-300 mb-8">R$ {resultado.precoSugerido.toFixed(2).replace('.', ',')}</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                          <div className="flex justify-between border-b border-slate-800 pb-2"><span>Custo Base:</span><span className="font-bold">R$ {resultado.custoBase.toFixed(2).replace('.', ',')}</span></div>
                          <div className="flex justify-between border-b border-slate-800 pb-2"><span>Comissão ({resultado.margemUsada.toFixed(1)}%):</span><span className="text-red-400">- R$ {resultado.comissaoVenda.toFixed(2).replace('.', ',')}</span></div>
                          <div className="flex justify-between border-b border-slate-800 pb-2"><span>Frete/Taxas:</span><span className="text-red-400">- R$ {resultado.freteTaxa.toFixed(2).replace('.', ',')}</span></div>
                          <div className="flex justify-between border-b border-slate-800 pb-2"><span>Impostos:</span><span className="text-red-400">- R$ {resultado.valorImposto.toFixed(2).replace('.', ',')}</span></div>
                        </div>
                        <div className="mt-8 bg-emerald-500/10 p-5 rounded-xl border border-emerald-500/20 flex items-center justify-between">
                          <div><p className="text-emerald-400 font-bold text-sm mb-1 uppercase">Lucro Líquido</p><p className="text-3xl font-extrabold text-emerald-300">R$ {resultado.lucroLiq.toFixed(2).replace('.', ',')}</p></div>
                          <div className="text-right"><p className="text-slate-400 text-xs mb-1 uppercase">Margem</p><div className="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-lg font-bold text-xl">{resultado.lucroLiqPct.toFixed(1).replace('.', ',')}%</div></div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
